# Public-IP default TLS vhost; named existing domain vhosts remain selected by SNI.
<VirtualHost *:443>
    ServerName 87.106.127.145
    DocumentRoot /var/www/osign-empty
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt-osign-ip/live/osign-public-ip/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt-osign-ip/live/osign-public-ip/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /osign/ http://127.0.0.1:8082/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse /osign/ http://127.0.0.1:8082/
    LimitRequestBody 16384
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    <Directory /var/www/osign-empty>
        Require all denied
        Options -Indexes
    </Directory>
    <Location /osign/>
        Require all granted
    </Location>
    <LocationMatch "^/(?!osign/(?:health|manifest|files/[A-Za-z0-9_-]{43}/manifest[.]plist)$)">
        Require all denied
    </LocationMatch>
    Header always set X-Content-Type-Options nosniff
    Header always set Cache-Control no-store
    ErrorLog ${APACHE_LOG_DIR}/osign-public-error.log
    CustomLog ${APACHE_LOG_DIR}/osign-public-access.log combined
</VirtualHost>
